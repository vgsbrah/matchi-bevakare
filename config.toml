# ============================================================
#  MATCHi-bevakare – inställningar
# ============================================================

[allmant]
# Hur ofta skriptet kollar när du kör med --loop (minuter).
# 3–5 min är lagom. Kör inte tätare än så, av hänsyn till MATCHi.
intervall_minuter = 5
# Kort paus mellan varje dag som hämtas (sekunder).
paus_mellan_anrop_sek = 0.7

[notis]
# Installera appen "ntfy" på mobilen och prenumerera på exakt detta topic.
# Namnet är din "hemlighet" – den som känner till det kan läsa notiserna.
ntfy_topic = ""
ntfy_server = "https://ntfy.sh"
# Valfritt: Telegram i stället för/utöver ntfy
# telegram_bot_token = ""
# telegram_chat_id = ""


# ------------------------------------------------------------
#  Hallar – lägg till fler [[hall]]-block för fler hallar
# ------------------------------------------------------------
[[hall]]
namn = "Stockholms Tennishall"
url = "https://www.matchi.se/facilities/stockholmstennishall"
id = 1931          # hittas automatiskt om du tar bort raden
sport = 1          # 1 = tennis
# 14 dagar utan medlemskap. Som medlem: sätt 21 OCH sätt MATCHI_COOKIE (se README).
dagar_fram = 21

# [[hall]]
# namn = "Annan hall"
# url = "https://www.matchi.se/facilities/annanhall"
# dagar_fram = 14


# ------------------------------------------------------------
#  Filter – en tid skickas om den matchar MINST ETT filter
# ------------------------------------------------------------
#  dagar           "mån-tor", "lör,sön", "vardagar", "helg", "alla"
#  start_tidigast  tiden får börja tidigast (t.ex. "18:00")
#  start_senast    tiden får börja senast
#  slut_senast     tiden måste vara slut senast
#  banor           valfritt, t.ex. ["bana 1", "bana 2"]
#  min_minuter     valfritt, t.ex. 90
#  hallar          valfritt, begränsa filtret till vissa hallar (namn enligt ovan)

[[filter]]
namn = "Vardagskvällar"
dagar = "mån-tor"
start_tidigast = "18:00"
start_senast = "22:00"
